<script>
/* KAMOME STRAIT: one world, several simulators. Each simulator's page sits above in its own <template id="sim-<id>">
   (inert: nothing in it runs or takes an id until chosen). This picks one, from ?sim=<id> or the last one played, and puts
   its page here; every simulator's code then loads below and SIMS.pick = KS_SIM makes the chosen one the one being played.
   Switching simulators reloads the page (see the start screen's switch), so each visit runs exactly one. A new simulator
   adds its template, its pieces and its role: nothing here names one. */
var KS_SIM = (function () {
  const ok = (id) => id && document.getElementById('sim-' + id);
  let id = new URLSearchParams(location.search).get('sim');
  if (!ok(id))
    try {
      id = localStorage.getItem('kamome.sim');
    } catch (e) {
      id = null;
    }
  if (!ok(id)) id = document.querySelector('template[id^="sim-"]').id.slice(4);
  document.currentScript.replaceWith(document.getElementById('sim-' + id).content.cloneNode(true));
  document.documentElement.dataset.sim = id;
  return id;
})();
</script>
